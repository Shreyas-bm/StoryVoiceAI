services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: storyvoice_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/venv
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: storyvoice_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped
