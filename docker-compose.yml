version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: storyvoice_db
    environment:
      POSTGRES_USER: storyvoice_user
      POSTGRES_PASSWORD: storyvoice_password
      POSTGRES_DB: storyvoice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: storyvoice_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: storyvoice_minio
    environment:
      MINIO_ROOT_USER: storyvoice_minio
      MINIO_ROOT_PASSWORD: storyvoice_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
